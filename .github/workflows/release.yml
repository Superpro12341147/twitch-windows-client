name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Test
        run: cargo test --release --locked

      - name: Build release executable
        run: cargo build --release --locked

      - name: Package release
        id: package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"$').Matches.Groups[1].Value
          if ($env:GITHUB_REF.StartsWith("refs/tags/") -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME must match Cargo.toml version v$version."
          }

          if ($env:GITHUB_REF.StartsWith("refs/tags/")) {
            $releaseTag = $env:GITHUB_REF_NAME
          } else {
            $releaseTag = "draft-v$version-run-$env:GITHUB_RUN_NUMBER-attempt-$env:GITHUB_RUN_ATTEMPT"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "release_tag=$releaseTag" -Encoding utf8

          $name = "TwitchWindowsClient-v$version-windows-x64"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\twitch-windows-client.exe "dist\$name.exe"
          Copy-Item -Path @("README.md", "CHANGELOG.md", "LICENSE") -Destination dist
          Compress-Archive -Path @("dist\$name.exe", "dist\README.md", "dist\CHANGELOG.md", "dist\LICENSE") -DestinationPath "dist\$name.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: twitch-windows-client-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ !startsWith(github.ref, 'refs/tags/') }}
          prerelease: ${{ startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.zip
