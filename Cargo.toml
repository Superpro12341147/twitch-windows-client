[package]
name = "twitch-windows-client"
version = "1.0.4"
edition = "2021"
description = "A lightweight Windows desktop shell for Twitch"
license = "MIT"
build = "build.rs"

[target.'cfg(target_os = "windows")'.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.34"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
wry = { version = "0.53", features = ["devtools"] }

[build-dependencies]
winres = "0.1"
